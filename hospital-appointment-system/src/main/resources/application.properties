# ==========================================================
# Hospital Appointment Scheduling & Telemedicine Management
# ==========================================================
# Every value below can be overridden by an environment variable of the
# same UPPER_SNAKE_CASE name (Spring's relaxed binding), which is how
# Render (and most hosts) injects config without editing this file.
# Local defaults (after the ':') let this run unmodified on your machine.

spring.application.name=hospital-appointment-system
server.port=${PORT:8080}

# ---------------- PostgreSQL Datasource ----------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospitaldb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------------- Session ----------------
server.servlet.session.timeout=20m

# ---------------- Jackson (REST API JSON) ----------------
# Frontend is static HTML/CSS/JS calling this REST API directly (no Thymeleaf).
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ---------------- Static resources ----------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**