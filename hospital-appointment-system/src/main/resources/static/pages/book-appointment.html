<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | HospitalCare</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="app-shell">

<div id="navHost"></div>

<main class="app-main app-main--narrow">
    <div class="card">
        <h2 class="page-title">Book Appointment</h2>

        <div id="alertHost"></div>

        <form id="bookingForm" class="booking-form">

            <div class="form-field">
                <label for="diseaseSelect">Disease</label>
                <select id="diseaseSelect" required>
                    <option value="">Select Disease</option>
                </select>
            </div>

            <div class="form-field">
                <label for="age">Age</label>
                <input type="number" id="age" min="1" max="120" required>
            </div>

            <div class="form-field">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-field">
                <label for="doctorSelect">Doctor</label>
                <select id="doctorSelect" required>
                    <option value="">Select Doctor</option>
                </select>
            </div>

            <div class="form-field">
                <label for="consultationMode">Consultation Type</label>
                <select id="consultationMode" required>
                    <option value="">Select Consultation Type</option>
                    <option value="ONLINE">Online Video Call</option>
                    <option value="OFFLINE">In-Person at Hospital</option>
                </select>
                <p style="font-size:0.82rem;color:var(--color-text-muted);margin:6px 0 0;">
                    Online consultations unlock a video call link once your slot begins.
                    In-person visits will not show a video call option.
                </p>
            </div>

            <div class="form-field">
                <label>Appointment Date</label>
                <div class="calendar-wrapper">
                    <div class="calendar-header">
                        <button type="button" class="nav-btn" onclick="changeMonth(-1)">
                            <span class="material-icons">chevron_left</span>
                        </button>
                        <span id="monthYear"></span>
                        <button type="button" class="nav-btn" onclick="changeMonth(1)">
                            <span class="material-icons">chevron_right</span>
                        </button>
                    </div>
                    <div class="weekdays">
                        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
                        <span>Thu</span><span>Fri</span><span>Sat</span>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
                <input type="hidden" id="appointmentDate" required>
            </div>

            <div class="form-field">
                <label for="timeSelect">Appointment Time</label>
                <select id="timeSelect" required disabled>
                    <option value="">Select Time Slot</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Confirm Appointment</button>
        </form>
    </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
<script>
  (async function init() {
    const session = await requireSession("patient");
    if (!session) return;

    try {
      const diseases = await apiFetch("/api/diseases");
      const diseaseSelect = document.getElementById("diseaseSelect");
      diseases.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = d.diseaseName;
        diseaseSelect.appendChild(opt);
      });
    } catch (e) {
      console.error("Could not load diseases", e);
    }
  })();

  document.getElementById("bookingForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const alertHost = document.getElementById("alertHost");
    alertHost.innerHTML = "";

    const payload = {
      diseaseId: Number(document.getElementById("diseaseSelect").value) || null,
      age: Number(document.getElementById("age").value) || null,
      gender: document.getElementById("gender").value,
      doctorId: Number(document.getElementById("doctorSelect").value) || null,
      date: document.getElementById("appointmentDate").value,
      time: document.getElementById("timeSelect").value ? document.getElementById("timeSelect").value + ":00" : null,
      consultationMode: document.getElementById("consultationMode").value,
    };

    if (!payload.diseaseId || !payload.doctorId || !payload.date || !payload.time || !payload.age || !payload.gender || !payload.consultationMode) {
      alertHost.innerHTML = '<div class="alert alert-error">Please complete every field before confirming.</div>';
      return;
    }

    try {
      await apiFetch("/api/appointments", { method: "POST", body: JSON.stringify(payload) });
      window.location.href = "/pages/view-appointments.html";
    } catch (err) {
      if (err.status === 409 && err.data) {
        alertHost.innerHTML = `<div class="alert alert-warning">
          You already have an appointment with <strong>Dr. ${err.data.doctorName}</strong>
          at <strong>${err.data.time}</strong>. Please choose another time slot.
        </div>`;
      } else {
        alertHost.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }
  });
</script>
</body>
</html>
