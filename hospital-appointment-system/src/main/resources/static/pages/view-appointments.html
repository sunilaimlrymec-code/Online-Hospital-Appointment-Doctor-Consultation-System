<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments | HospitalCare</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body class="app-shell">

<div id="navHost"></div>

<main class="app-main">
    <h2 class="page-title">My Appointments</h2>

    <div id="emptyState" class="empty-state" style="display:none;">
        <p><strong>No appointments booked yet.</strong></p>
        <a href="/pages/book-appointment.html" class="btn btn-primary mt-24">Book your first appointment</a>
    </div>

    <div class="appointment-grid" id="appointmentGrid"></div>
</main>

<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
<script>
  function formatDateTime(dateStr, timeStr) {
    const d = new Date(dateStr + "T" + timeStr);
    return d.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }) +
      " at " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  }

  function renderCard(a) {
    const card = document.createElement("article");
    card.className = "appointment-card";
    card.dataset.datetime = a.appointmentDate + "T" + a.appointmentTime;
    card.dataset.mode = a.consultationMode;

    const modeLabel = a.consultationMode === "ONLINE"
      ? `<span class="status live" style="background:#e6f0ff;color:#1450b8;">Online Video Call</span>`
      : `<span class="status completed">In-Person at Hospital</span>`;

    const locationHtml = a.consultationMode === "OFFLINE"
      ? `<div style="background:var(--color-primary-light);border-radius:var(--radius-sm);padding:12px 14px;font-size:0.88rem;">
           <strong style="display:flex;align-items:center;gap:6px;color:var(--color-primary-dark);">
             <span class="material-icons" style="font-size:18px;">location_on</span> ${a.hospitalName}
           </strong>
           <div style="margin-top:4px;color:var(--color-text);">${a.hospitalAddress}</div>
           ${a.locationDetails ? `<div style="margin-top:2px;color:var(--color-text-muted);">${a.locationDetails}</div>` : ""}
         </div>`
      : "";

    const videoButtonHtml = a.consultationMode === "ONLINE"
      ? `<button class="btn btn-outline video-btn" disabled onclick="location.href='/pages/telemedicine.html?appointmentId=${a.id}'">
           Video Call Locked
         </button>`
      : "";

    card.innerHTML = `
      <h3>Dr. ${a.doctorName}</h3>
      <p><strong>Disease:</strong> ${a.diseaseName}</p>
      <p><strong>Date &amp; Time:</strong> ${formatDateTime(a.appointmentDate, a.appointmentTime)}</p>
      ${modeLabel}
      ${locationHtml}
      <span class="status scheduled">${a.status}</span>
      <div class="timer">Loading...</div>
      <div class="card-actions">
        ${videoButtonHtml}
        ${
          a.reviewSubmitted
            ? `<a class="btn btn-primary" href="/pages/view-report.html?appointmentId=${a.id}">View Report</a>`
            : ""
        }
      </div>
    `;
    return card;
  }

  (async function init() {
    const session = await requireSession("patient");
    if (!session) return;

    try {
      const appointments = await apiFetch("/api/appointments");
      const grid = document.getElementById("appointmentGrid");
      const empty = document.getElementById("emptyState");

      if (!appointments.length) {
        empty.style.display = "block";
        return;
      }

      appointments.forEach((a) => grid.appendChild(renderCard(a)));
      initAppointmentCards();
    } catch (err) {
      console.error(err);
    }
  })();
</script>
</body>
</html>
